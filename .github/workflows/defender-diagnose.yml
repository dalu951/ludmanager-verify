name: Defender-Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Vorbereiten
        shell: pwsh
        run: |
          $dir = 'C:\diag'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $eicar = 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
          Set-Content -Path (Join-Path $dir 'eicar.com') -Value $eicar -NoNewline -Encoding ascii
          Get-ChildItem $dir | Select-Object Name, Length | Out-Host

      - name: Ausschluesse entfernen
        shell: pwsh
        run: |
          Get-MpPreference | Select-Object -Property ExclusionPath | Format-List | Out-Host
          try {
            Remove-MpPreference -ExclusionPath 'C:\', 'D:\' -ErrorAction Stop
            'Ausschluesse entfernt' | Out-Host
          } catch {
            "Entfernen fehlgeschlagen: $($_.Exception.Message)" | Out-Host
          }
          Get-MpPreference | Select-Object -Property ExclusionPath | Format-List | Out-Host

      - name: Realtime-Schutz an
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop; 'Realtime an' | Out-Host } catch { "Realtime: $($_.Exception.Message)" | Out-Host }
          (Get-MpComputerStatus) | Select-Object RealTimeProtectionEnabled, IsTamperProtected | Format-List | Out-Host

      - name: Kontrolle mit EICAR
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mp -Scan -ScanType 3 -File 'C:\diag\eicar.com' 2>&1 | Out-Host
          "EICAR Exit: $LASTEXITCODE" | Out-Host

      - name: Fundstellen auflisten
        shell: pwsh
        run: |
          Get-MpThreatDetection -ErrorAction SilentlyContinue | Select-Object -First 5 ThreatID, InitialDetectionTime, Resources | Format-List | Out-Host
