name: Defender-Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Vorbereiten
        shell: pwsh
        run: |
          $dir = 'C:\diag'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $eicar = 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
          Set-Content -Path (Join-Path $dir 'eicar.com') -Value $eicar -NoNewline -Encoding ascii
          Set-Content -Path (Join-Path $dir 'klein.txt') -Value ('A' * 1000) -NoNewline
          $groß = Join-Path $dir 'gross.bin'
          $fs = [System.IO.File]::Create($groß); $buf = New-Object byte[] (4MB); $fs.Write($buf, 0, $buf.Length); $fs.Close()
          Get-ChildItem $dir | Select-Object Name, Length | Out-Host

      - name: Defender-Zustand
        shell: pwsh
        run: |
          $s = Get-MpComputerStatus
          $s | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion | Format-List | Out-Host
          Get-MpPreference | Select-Object -Property ExclusionPath, ExclusionExtension, ExclusionProcess | Format-List | Out-Host

      - name: MpCmdRun gegen kleine Datei
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mp -Scan -ScanType 3 -File 'C:\diag\eicar.com' 2>&1 | Out-Host
          "EICAR Exit: $LASTEXITCODE" | Out-Host

      - name: MpCmdRun gegen 4-MB-Datei
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mp -Scan -ScanType 3 -File 'C:\diag\gross.bin' 2>&1 | Out-Host
          "4MB Exit: $LASTEXITCODE" | Out-Host

      - name: Start-MpScan auf Ordner
        shell: pwsh
        run: |
          Start-MpScan -ScanType CustomScan -ScanPath 'C:\diag'
          'Start-MpScan fertig' | Out-Host
          Get-MpThreatDetection -ErrorAction SilentlyContinue | Select-Object -First 5 ThreatID, Resources | Format-List | Out-Host
